  <script>
    document.addEventListener('DOMContentLoaded', () => {

        targets: '.logo',
        opacity: [0, 1],
        scale: [0.82, 1],
        translateY: [45, 0],
        rotate: [-2, 0],
        duration: 1800,
        easing: 'easeOutExpo'
      });

      anime({
        targets: '.hero-title',
        opacity: [0, 1],
        translateY: [70, 0],
        skewY: [4, 0],
        duration: 1600,
        delay: 250,
        easing: 'easeOutExpo'
      });

      anime({
        targets: '.hero-subtitle',
        opacity: [0, 1],
        translateY: [35, 0],
        duration: 1400,
        delay: 550,
        easing: 'easeOutExpo'
      });

      anime({
        targets: '.hero-button',
        opacity: [0, 1],
        scale: [0.9, 1],
        translateY: [25, 0],
        duration: 1200,
        delay: 800,
        easing: 'easeOutExpo'
